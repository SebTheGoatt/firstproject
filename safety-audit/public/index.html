<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Safety Audit Control Center</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <!-- Top Status Navigation Bar -->
    <nav class="border-b border-slate-800 bg-slate-950 px-6 py-4 flex flex-wrap gap-3 justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-xl font-bold tracking-tight text-white">SafetySaaS <span class="text-emerald-400 font-medium text-sm">Enterprise</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-slate-400">Account ID: <span class="font-mono text-slate-200" id="accountId">cus_Test8972</span></span>
            <div class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/20">Active Subscription</div>
        </div>
    </nav>

    <!-- Main Workspace Layout -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left Processing Panel -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-2">Upload Daily Log</h2>
                <p class="text-sm text-slate-400 mb-6">Drop shop logs or equipment checklists here for instantaneous cross-reference analysis.</p>

                <div class="border-2 border-dashed border-slate-700 hover:border-emerald-500 transition-colors rounded-xl p-8 text-center cursor-pointer bg-slate-900/50 group">
                    <input type="file" id="logUpload" class="hidden" accept=".pdf" />
                    <label for="logUpload" class="cursor-pointer space-y-3 block">
                        <div class="text-3xl text-slate-500 group-hover:text-emerald-400 transition-colors">📄</div>
                        <div class="text-sm font-medium text-slate-300 break-all" id="fileLabel">Select daily operations PDF</div>
                        <div class="text-xs text-slate-500">Max size 15MB</div>
                    </label>
                </div>
                <button id="runAuditBtn" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-wait text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-emerald-900/20">Execute Engine Audit</button>
            </div>
        </section>

        <!-- Right Insights Panel -->
        <section class="lg:col-span-2 space-y-6">
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-xl min-h-[400px] flex flex-col">
                <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                    <h2 class="text-lg font-bold text-white">Live Compliance Evaluation</h2>
                    <div class="text-3xl font-black text-slate-500" id="scoreMetric">--</div>
                </div>

                <!-- Live Structural Output State -->
                <div id="resultsWorkspace" class="flex-1 space-y-6 text-slate-400 text-sm">
                    <div class="text-center py-12 text-slate-600 font-medium">Await file ingestion pipeline to compile metrics...</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const MAX_BYTES = 15 * 1024 * 1024;
        const fileInput = document.getElementById('logUpload');
        const runBtn = document.getElementById('runAuditBtn');
        const workspace = document.getElementById('resultsWorkspace');
        const scoreMetric = document.getElementById('scoreMetric');

        // Model output goes into the page, so escape it before rendering
        const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

        const renderList = (title, items, color) => `
            <div><h3 class="font-bold text-slate-200 text-xs uppercase tracking-wider mb-2">${title}</h3>
            ${items.length
                ? `<ul class="list-disc pl-5 space-y-1 ${color}">${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`
                : '<p class="text-slate-600">None flagged.</p>'}</div>`;

        const showError = (msg) => {
            workspace.innerHTML = `<div class="text-rose-400 font-medium">${escapeHtml(msg)}</div>`;
        };

        fileInput.addEventListener('change', () => {
            document.getElementById('fileLabel').innerText = fileInput.files[0]?.name || 'Select daily operations PDF';
        });

        runBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert('Please upload a safety log file first.');
            if (file.size > MAX_BYTES) return alert('That file is over the 15MB limit.');

            const formData = new FormData();
            formData.append('file', file);

            runBtn.disabled = true;
            scoreMetric.innerText = '--';
            scoreMetric.className = 'text-3xl font-black text-slate-500';
            workspace.innerHTML = '<div class="text-center py-12 text-emerald-400 font-medium animate-pulse">Running advanced text compliance extraction routines...</div>';

            try {
                const customerId = document.getElementById('accountId').innerText;
                const response = await fetch(`/api/v1/audit?stripe_customer_id=${encodeURIComponent(customerId)}`, {
                    method: 'POST',
                    body: formData
                });
                const resData = await response.json();

                if (!response.ok || !resData.success) {
                    return showError(resData.detail || 'Audit failed. Please try again.');
                }

                const { complianceScore, criticalViolations, equipmentRisks, actionableSteps } = resData.data;
                scoreMetric.innerText = complianceScore + '%';
                scoreMetric.className = 'text-3xl font-black ' +
                    (complianceScore > 80 ? 'text-emerald-400' : complianceScore > 60 ? 'text-amber-400' : 'text-rose-400');

                workspace.innerHTML = `
                    <div class="space-y-4">
                        ${renderList('Critical Flaws Detected', criticalViolations, 'text-rose-400')}
                        ${renderList('Machine Anomaly Risks', equipmentRisks, 'text-amber-400')}
                        ${renderList('Required Mitigations', actionableSteps, 'text-emerald-400')}
                    </div>`;
            } catch (err) {
                showError('Failed to communicate with processing core. Check server array logs.');
            } finally {
                runBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
