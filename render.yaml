# Render Blueprint for property-dispatch (the website, booking, and crew app)
# plus the 5 PM (close of business) route-building job.
#
# Render → New → Blueprint → pick this repo and branch. Render will ask for
# every value marked `sync: false`. Values with `generateValue` are created
# for you as random secrets.

services:
  - type: web
    name: property-dispatch
    runtime: docker
    rootDir: property-dispatch
    plan: 0.5c-512mb          # always on; the free plan sleeps and makes the crew wait
    healthCheckPath: /healthz
    envVars:
      - key: DATA_BACKEND
        value: supabase
      - key: BUSINESS_TIMEZONE
        value: America/Chicago
      - key: BASE_LAT
        value: "30.0799"
      - key: BASE_LNG
        value: "-95.4172"
      - key: BUSINESS_NAME
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEOCODER_USER_AGENT
        sync: false
      # Optional: Google address dropdown on the booking form (browser key).
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Card payments (Stripe). Leave blank to take cash only.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Business contact email shown on the site footer and policy pages (blank = not shown).
      - key: BUSINESS_EMAIL
        sync: false
      # Optional: Google review link (Google Business Profile → "Ask for reviews"). Blank = no review requests.
      - key: GOOGLE_REVIEW_URL
        sync: false
      - key: CREW_ACCESS_TOKEN
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: property-dispatch-nightly
    runtime: docker
    rootDir: property-dispatch
    plan: 0.5c-512mb
    # Cron is UTC. 5 PM Central = 22:00 UTC (CDT) or 23:00 UTC (CST).
    # Hourly 22:00-02:00 UTC: the first run at/after 5 PM Central builds
    # tomorrow's route; later runs (until 8-9 PM) catch up if it was missed.
    schedule: "0 22,23,0,1,2 * * *"
    dockerCommand: python -m app.nightly
    envVars:
      - key: DATA_BACKEND
        value: supabase
      - key: BUSINESS_TIMEZONE
        value: America/Chicago
      - key: BASE_LAT
        value: "30.0799"
      - key: BASE_LNG
        value: "-95.4172"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
