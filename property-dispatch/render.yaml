# Render Blueprint: one web service + one cron job sharing env vars.
# Render → New → Blueprint → pick this repo. Set the `sync: false` values in the dashboard.
envVarGroups:
  - name: property-dispatch
    envVars:
      - key: DATA_BACKEND
        value: supabase
      - key: BUSINESS_TIMEZONE
        value: America/Chicago
      - key: BASE_LAT
        value: "30.0799"
      - key: BASE_LNG
        value: "-95.4172"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEOCODER_USER_AGENT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: CREW_ACCESS_TOKEN
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: property-dispatch
    runtime: docker
    rootDir: property-dispatch
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - fromGroup: property-dispatch

  - type: cron
    name: property-dispatch-nightly
    runtime: docker
    rootDir: property-dispatch
    plan: starter
    # Cron is UTC. 8 PM Central = 01:00 UTC (CDT) or 02:00 UTC (CST).
    # Run at both; the script exits unless it is 20:00 in America/Chicago.
    schedule: "0 1,2 * * *"
    dockerCommand: python -m app.nightly
    envVars:
      - fromGroup: property-dispatch
