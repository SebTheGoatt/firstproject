<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Price Estimate | {{BUSINESS_NAME}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F2B22">
  <link rel="icon" href="/favicon.ico">
  <link rel="preload" href="/static/fonts/big-shoulders-display-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/public-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The utility classes the engine's breakdown uses (no Tailwind on this site) are in styles.css under .page-estimate. -->
  <link rel="stylesheet" href="/static/styles.css?v={{V}}">
</head>
<body class="site page-booking page-estimate">
  <header class="site-header">
    <div class="site-wrap header-row">
      <a class="brand" href="/">{{BRAND}}</a>
      <a class="btn btn-sm" href="/">Home</a>
    </div>
  </header>
  <main>
    <header class="page-intro book-hero">
      <div class="wrap">
        <h1>Instant price estimate</h1>
        <p>Check your price before you book.</p>
      </div>
    </header>

    <div class="wrap book-body">
      <div class="card estimate-form">
        <div class="field">
          <label for="address-input">Service address</label>
          <div id="address-slot"><input id="address-input" type="text" autocomplete="street-address" placeholder="Start typing your address…"></div>
        </div>
        <div class="field">
          <label for="lot-size-select">Lot size</label>
          <select id="lot-size-select">
            <option value="3000">Up to 3,000 sq ft</option>
            <option value="5000" selected>5,000 sq ft</option>
            <option value="7500">7,500 sq ft</option>
            <option value="10000">10,000 sq ft</option>
            <option value="15000">15,000 sq ft</option>
            <option value="20000">20,000 sq ft</option>
          </select>
        </div>
        <div class="field">
          <label for="complexity-select">Yard type</label>
          <select id="complexity-select">
            <option value="STANDARD">Standard</option>
            <option value="COMPLEX_OBSTACLES">Lots of trees or beds</option>
            <option value="STEEP_SLOPES">Steep slopes</option>
          </select>
        </div>
        <div class="checks">
          <addon-injector></addon-injector>
        </div>
        <button class="btn btn-primary btn-block" type="button" id="calculate-price-btn">Calculate price</button>
      </div>
      <div class="estimate-result" aria-live="polite">
        <p class="total">Total: <span id="checkout-total-anchor">—</span></p>
        <div id="pricing-breakdown-display"></div>
      </div>
      <a class="btn btn-outline btn-block" href="/book">Book a visit</a>
    </div>
  </main>
  <footer class="mini-footer site-wrap">{{LEGAL_FOOTER}}</footer>

  <script src="/static/places.js?v={{V}}"></script>
  <script src="/static/addon-injector.js?v={{V}}"></script>
  <script src="/static/yield-engine.js?v={{V}}"></script>
  <script>
    // Address step: the Google dropdown (when the Maps key is set) feeds the engine the real location.
    fetch("/api/booking-info").then((r) => r.json()).then((info) => {
      if (!info.google_maps_key || !window.SGPlaces) return;
      SGPlaces.attach(info.google_maps_key, {
        slot: document.getElementById("address-slot"), id: "address-input", label: "Service address",
        onPick: (text, lat, lng) => SemperGreenEngine.setLocation(text, lat, lng),
      });
    }).catch(() => {});
  </script>
</body>
</html>
