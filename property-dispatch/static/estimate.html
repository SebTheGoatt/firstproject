<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Price Estimate | {{BUSINESS_NAME}}</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b3d2e">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/styles.css?v={{V}}">
  <style>
    /* The utility classes the engine's breakdown uses (no Tailwind on this site). */
    .space-y-2 > * + * { margin-top: 8px; } .p-4 { padding: 16px; } .my-2 { margin: 8px 0; } .pt-2 { padding-top: 8px; }
    .rounded-lg { border-radius: 12px; } .border { border: 1px solid; } .border-t { border-top: 1px solid; }
    .bg-zinc-900 { background: #18181b; } .border-zinc-800 { border-color: #27272a; } .text-white { color: #fff; }
    .text-zinc-400 { color: #a1a1aa; } .text-emerald-400 { color: #34d399; } .text-amber-500 { color: #f59e0b; }
    .text-green-400 { color: #4ade80; } .text-red-500 { color: #ef4444; }
    .flex { display: flex; } .justify-between { justify-content: space-between; gap: 12px; }
    .text-xs { font-size: 0.8rem; } .text-sm { font-size: 0.92rem; } .text-base { font-size: 1.05rem; } .font-bold { font-weight: 700; }
    .font-mono { font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
    .estimate { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    .estimate .field select, .estimate .field input[type=text] { width: 100%; min-height: 48px; }
    .estimate .checks label { display: flex; align-items: center; gap: 10px; min-height: 48px; }
    .estimate .total { font-size: 1.6rem; font-weight: 800; margin: 16px 0 8px; }
  </style>
</head>
<body>
  <main class="estimate">
    <h1>Instant price estimate</h1>
    <div class="field">
      <label for="address-input">Service address</label>
      <div id="address-slot"><input id="address-input" type="text" autocomplete="street-address" placeholder="Start typing your address…"></div>
    </div>
    <div class="field">
      <label for="lot-size-select">Lot size</label>
      <select id="lot-size-select">
        <option value="3000">Up to 3,000 sq ft</option>
        <option value="5000" selected>5,000 sq ft</option>
        <option value="7500">7,500 sq ft</option>
        <option value="10000">10,000 sq ft</option>
        <option value="15000">15,000 sq ft</option>
        <option value="20000">20,000 sq ft</option>
      </select>
    </div>
    <div class="field">
      <label for="complexity-select">Yard type</label>
      <select id="complexity-select">
        <option value="STANDARD">Standard</option>
        <option value="COMPLEX_OBSTACLES">Lots of trees or beds</option>
        <option value="STEEP_SLOPES">Steep slopes</option>
      </select>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="toggle-bins"> Bin cleaning (+$15)</label>
      <label><input type="checkbox" id="toggle-gutters"> Gutter cleaning (+$15)</label>
    </div>
    <button class="btn btn-primary btn-block" type="button" id="calculate-price-btn">Calculate price</button>
    <p class="total">Total: <span id="checkout-total-anchor">—</span></p>
    <div id="pricing-breakdown-display"></div>
    <p class="hint"><a href="/book">Book a visit</a></p>
  </main>
  {{LEGAL_FOOTER}}

  <script src="/static/places.js?v={{V}}"></script>
  <script src="/static/yield-engine.js?v={{V}}"></script>
  <script>
    // Address step: the Google dropdown (when the Maps key is set) feeds the engine the real location.
    fetch("/api/booking-info").then((r) => r.json()).then((info) => {
      if (!info.google_maps_key || !window.SGPlaces) return;
      SGPlaces.attach(info.google_maps_key, {
        slot: document.getElementById("address-slot"), id: "address-input", label: "Service address",
        onPick: (text, lat, lng) => SemperGreenEngine.setLocation(text, lat, lng),
      });
    }).catch(() => {});
  </script>
</body>
</html>
